; RETRANSMISSOR (TURN) para o multijogador pela internet funcionar no 4G e em redes com CGNAT.
; Copie este arquivo como  rede/turn.cfg  (fica fora do git) e preencha usuario e senha da sua conta TURN.
; Exemplo com o plano grátis da Metered (metered.ca > Dashboard > TURN Server > credenciais).
[turn]
urls="stun:stun.relay.metered.ca:80,turn:standard.relay.metered.ca:80,turn:standard.relay.metered.ca:80?transport=tcp,turn:standard.relay.metered.ca:443,turns:standard.relay.metered.ca:443?transport=tcp"
usuario=""
senha=""

; 0.88 · CLOUDFLARE REALTIME TURN (dash.cloudflare.com > Realtime > TURN Server > Create): 1000 GB grátis.
; id = "Turn Token ID" e token = "API Token" da chave criada. O jogo pede sozinho uma senha de 24 h à Cloudflare
; quando abre a partida. Ordem de uso: [turn_proprio] > [turn_cloudflare] > [turn] (os que existirem).
[turn_cloudflare]
id=""
token=""

; 0.87 · SEU RETRANSMISSOR PRÓPRIO (coturn na Oracle Cloud: servidor_turn/instalar_turn.sh e LEIA-ME_ORACLE.txt).
; Quando existe, o jogo usa ELE primeiro e a Metered acima vira a reserva (se ele não responder em ~9 s).
[turn_proprio]
url="turn:IP_DA_SUA_MAQUINA:3478"
usuario="dda"
senha=""
